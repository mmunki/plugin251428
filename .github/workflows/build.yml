name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and test
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/app-release.apk
          if-no-files-found: error
